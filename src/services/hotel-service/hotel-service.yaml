apiVersion: apps/v1
kind: Deployment
metadata:
  name: hotel-service
  namespace: microservices
  labels:
    app: hotel-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hotel-service
  template:
    metadata:
      labels:
        app: hotel-service
    spec:
      containers:
      - name: hotel-service
        image: hotel-service:1.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8082
        env:
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef: 
              name: app-secrets
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: POSTGRES_PASSWORD
        - name: POSTGRES_PORT
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: POSTGRES_PORT
        - name: POSTGRES_HOST
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: POSTGRES_HOST
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: HOTEL_DB
        - name: PRIVATE_KEY
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: privateKey
        - name: PUBLIC_KEY
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: publicKey
        - name: GATEWAY_SERVICE_UUID
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: GATEWAY_SERVICE_UUID
        - name: BOOKING_SERVICE_UUID
          valueFrom:
            configMapKeyRef: 
              name: app-config
              key: BOOKING_SERVICE_UUID
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"


---

apiVersion: v1
kind: Service
metadata:
  name: hotel-service
  namespace: microservices
  labels:
    app: hotel-service
spec:
  selector:
    app: hotel-service
  ports:
  - port: 8082
    targetPort: 8082
  type: ClusterIP